name = "calpher-workbench"
main = "worker.js"
compatibility_date = "2026-05-31"
workers_dev = true

# 注意：wrangler 4.120.0 把每个 glob 锚定为正则并匹配 esbuild 的导入路径（带 ./ 前缀），
# 不带 **/ 的精确 glob（如 "static/app.js"）匹配不到 "./static/app.js"，会静默失败。
# 必须给每个非 html glob 加 **/ 前缀。auth/auth.js 不在此列表，保持 ES module。
rules = [
  { type = "Text", globs = ["**/*.html", "**/static/*.js", "**/static/vendor/*.js", "**/static/*.css", "**/design-system/components.js", "**/design-system/styles.css", "**/apps.json"], fallthrough = true },
  { type = "Data", globs = ["**/static/assets/*.webp"], fallthrough = true }
]

[[kv_namespaces]]
binding = "WORKBENCH_KV"
id = "40ab31dd4ade4a52acf39c567983e22a"

[vars]
# 主站自身也声明权威 origin，使三站使用同一套模式判定与登录地址。
AUTH_MASTER_ORIGIN = "https://www.kypher72.indevs.in"
# 同父域部署可共享 Cookie；当前异域子站仍通过签名 handoff 接入。
PARENT_DOMAIN = "kypher72.indevs.in"
